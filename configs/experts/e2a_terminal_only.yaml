# Expert training config — e2a_terminal_only
# Trained on Tinker (LoRA, managed). Every value here is a snapshot of what
# src/train/train_expert.py sends; logs/<run_id>/metadata.json repeats it.
expert_name: e2a_terminal_only
target_benchmark: "terminal_bench_2"
data_domain: terminal_agent
data_description: "Terminal / tool-use / research-execution trajectories (Terminal-Bench 1.x minus 2.0 overlap, AgentTuning, synthetic shell + science tasks)"

base:
  tinker_model: Qwen/Qwen3.6-35B-A3B
  hf_model: Qwen/Qwen3.6-35B-A3B
  hf_revision: LOCK                      # copy from data/manifests/base_model.json
  chat_template: base                    # unchanged; thinking traces kept in assistant turn

method: lora                             # Tinker only offers LoRA; full FT is out of budget (35B MoE)
lora:
  rank: 32
  alpha: 64                              # Tinker convention alpha = 2 * rank unless overridden
  target_modules: all_linear             # Tinker flags below; exact HF module list read from exported adapter_config.json
  tinker_flags: {train_attn: true, train_mlp: true, train_unembed: true}   # create_lora_training_client kwargs; MoE experts fall under train_mlp
  dropout: 0.0
quantization: none                       # bf16 on Tinker

optim:
  learning_rate: 1.0e-4                  # ~10x full-FT LR per Tinker LoRA primer
  lr_schedule: cosine
  warmup_steps: 20
  weight_decay: 0.0
  batch_size_examples: 32
  max_seq_len: 32768
  n_train_examples: 7000
  epochs: 2
  max_steps: null                        # derived: ceil(n_train_examples * epochs / batch_size_examples)
  grad_clip: 1.0

data:
  train_file: data/processed/e2a_terminal_only_train.jsonl
  dev_file: data/processed/e2a_terminal_only_dev.jsonl   # independent dev split, used for checkpoint selection
  dev_size: 500
  loss_on: assistant_only

checkpointing:
  save_every_steps: 100
  keep: all
  select_by: dev_loss_min                # never by benchmark score
  export: peft_adapter                   # weights.build_lora_adapter -> models/weights/e2a_terminal_only/

seed: 42
run_id: null                             # set at launch: ${expert_name}_r${rank}_s${seed}_${date}
