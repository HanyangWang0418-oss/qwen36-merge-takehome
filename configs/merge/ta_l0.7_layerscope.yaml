# Ablation: restrict e1 to layers 20-39 (upper half) to test whether code-repair
# behaviour lives in late layers and whether early-layer conflicts hurt HLE.
method: task_arithmetic
density: 1.0
out_rank: 96
seed: 0
output_dir: models/weights/merged_ta_l0.7_layerscope
experts:
  - {path: models/weights/e1_code_repair,    lambda: 0.7, layers: "20-39"}
  - {path: models/weights/e2_terminal_agent, lambda: 0.7, layers: null}
  - {path: models/weights/e3_reasoning,      lambda: 0.7, layers: null}
