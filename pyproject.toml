[project]
name = "qwen36-merge-takehome"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "huggingface-hub>=2.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "safetensors>=0.8.0",
    "tqdm>=4.70.1",
    "tinker>=0.33",
    "transformers>=5.0",
    "jinja2>=3.1.6",
    "e2b==2.45.0",
    "alibabacloud-cs20151215>=7.2.0",
    "alibabacloud-ecs20140526>=7.11.6",
    "alibabacloud-vpc20160428>=7.2.2",
    "alibabacloud-cr20181201>=2.2.5",
    "alibabacloud-tea-openapi>=0.4.6",
    "alibabacloud-sts20150401>=1.2.0",
    "alibabacloud-ram20150501>=1.3.0",
    "openai>=3.33.0",
]

[project.optional-dependencies]
merge = ["torch>=2.14.1"]   # only src/merge/merge_adapters.py needs torch (bf16 adapters, SVD)

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
