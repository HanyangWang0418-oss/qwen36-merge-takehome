name: build-terminal-bench-2-images
# Builds the 89 Terminal-Bench 2.0 task images (environment/Dockerfile) at the locked dataset
# commit and pushes them to ACR as <ns>/tb2-<task>:<commit8> and :latest.
# Secrets: ACR_HOST, ACR_NAMESPACE, ACR_USERNAME, ACR_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated task names (empty = all)"
        required: false
        default: ""
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      commit: ${{ steps.m.outputs.commit }}
      url: ${{ steps.m.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - "${{ github.event.inputs.only }}" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          m = json.load(open("data/manifests/terminal_bench_2_tasks.json"))
          only = [x for x in sys.argv[1].split(",") if x]
          ids = [t for t in m["task_ids"] if not only or t in only]
          n = 10
          shards = [ids[k::n] for k in range(n)]
          print("matrix=" + json.dumps({"include": [{"shard": k, "tasks": " ".join(s)} for k, s in enumerate(shards) if s]}))
          print("commit=" + m["dataset_git_commit"][0])
          print("url=" + m["dataset_git_url"][0])
          PY
  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: checkout dataset at locked commit
        run: |
          git clone --quiet "${{ needs.plan.outputs.url }}" tb2 && git -C tb2 checkout --quiet "${{ needs.plan.outputs.commit }}"
      - uses: docker/setup-buildx-action@v3
      - name: login ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_HOST }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: build shard ${{ matrix.shard }}
        run: |
          set -u
          c8=$(echo "${{ needs.plan.outputs.commit }}" | cut -c1-8)
          fail=0
          for t in ${{ matrix.tasks }}; do
            d="tb2/$t/environment"
            img="${{ secrets.ACR_HOST }}/${{ secrets.ACR_NAMESPACE }}/tb2-$t"
            if docker buildx imagetools inspect "$img:$c8" >/dev/null 2>&1; then echo "skip $t"; continue; fi
            echo "build $t"
            docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
              -t "$img:latest" -t "$img:$c8" --push "$d" > "build_$t.log" 2>&1 \
              && echo "done $t" || { echo "FAIL $t"; tail -40 "build_$t.log"; fail=1; }
            docker builder prune -af >/dev/null 2>&1 || true
          done
          exit $fail
